[project]
name = "gautam"
version = "0.1.0"
description = "Project Gautam: a local, searchable library of your research papers (RAG), with DOI checking, BibTeX export and one-page summaries."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "sentence-transformers>=3.3",
    "transformers>=4.51",
]

[project.scripts]
gautam = "gautam.cli:main"
gautam-mcp = "gautam.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gautam"]
