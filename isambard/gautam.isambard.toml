# Project Gautam settings for Isambard-AI (used by run.sbatch). Paths are relative to this isambard/ folder.
# model and dim MUST match your Mac's gautam.toml, or the Mac cannot search the result.

[library]
dirs = ["../pdfs"]       # rsync your PDFs into <gautam folder>/pdfs
inbox = "../inbox"

[data]
dir = "../data_isambard"

[embedding]
backend = "sentence-transformers"
model = "Qwen/Qwen3-Embedding-0.6B"
dim = 512
device = "auto"          # picks the H100 (cuda)
batch_size = 128         # the H100 has 96 GB; drop to 64 if you see "out of memory"

[contact]
email = ""               # put your Brunel email here (Crossref / Europe PMC etiquette)

[harvest]
# Europe PMC fields: TITLE_ABS = title + abstract (recommended). Leave topics out to use the built-in list:
# protein dynamics, MD of enzymes, enzyme dynamics, allostery, conformational ensembles, beta-lactamase
# dynamics, TIM barrel, coevolution, Koopman/MSM, coarse-graining, protein language models, protein design,
# intrinsically disordered proteins, Skp1, SCF complex.
field = "TITLE_ABS"
# year_from = 2000
requests_per_second = 8
# Optional: a free NCBI API key (ncbi.nlm.nih.gov/account) lifts NCBI's limit from 3 to 10 requests/s
# ncbi_api_key = ""

# To edit the topics, uncomment and change this table (name = Europe PMC query):
# [harvest.topics]
# "Skp1" = 'Skp1 OR SKP1'
# "protein design" = '"protein design" OR "de novo protein"'

[graph]
# Weighted citation-graph search (`gautam graph settings` explains each). Defaults shown.
decay = 0.5          # weight kept per step away from your library
beta = 0.5           # relevance vs citations: 0 citations only, 1 relevance only
min_citations = 3    # cited by this many library papers -> eligible regardless of topic
min_relevance = 0.6  # or cited once and at least this relevant
budget = 20000       # most papers added per round
max_hops = 2
lookup_factor = 3
knn = 10
stop_gain = 0.01

# Key people (searched for every step: counts, open-access collection, abstracts).
# This table replaces the built-in list. Common names are pinned to an institution (AFF) or a subject,
# or they match unrelated people.
[harvest.authors]
"Andrei Lupas" = 'AUTH:"Lupas AN"'
"Helmut Grubmüller" = '(AUTH:"Grubmüller H" OR AUTH:"Grubmuller H")'
"Lewis Kay" = 'AUTH:"Kay LE" AND (AFF:"Toronto" OR TITLE_ABS:(protein OR proteins OR enzyme OR NMR OR dynamics))'
"Dorothee Kern" = 'AUTH:"Kern D" AND (AFF:"Brandeis" OR AFF:"Howard Hughes")'
"Hans Frauenfelder" = 'AUTH:"Frauenfelder H"'
"Rik Wierenga" = 'AUTH:"Wierenga RK"'
"Martin Karplus" = 'AUTH:"Karplus M" AND TITLE_ABS:(protein OR proteins OR enzyme OR molecular OR dynamics)'
"Arieh Warshel" = 'AUTH:"Warshel A"'
"Alessandro Pandini" = 'AUTH:"Pandini A"'
"Liskin Swint-Kruse" = 'AUTH:"Swint-Kruse L"'
"David Baker" = 'AUTH:"Baker D" AND (AFF:"University of Washington" OR AFF:"Institute for Protein Design")'
"Frances Arnold" = 'AUTH:"Arnold FH"'
"Debora Marks" = 'AUTH:"Marks DS" AND (AFF:"Harvard" OR TITLE_ABS:(protein OR evolution OR sequence OR variant))'
"Faruck Morcos" = 'AUTH:"Morcos F"'
"Ruth Nussinov" = 'AUTH:"Nussinov R"'
"Ivet Bahar" = 'AUTH:"Bahar I"'
"Frank Noé" = '(AUTH:"Noé F" OR AUTH:"Noe F")'
"Peter Wright" = 'AUTH:"Wright PE" AND (AFF:"Scripps" OR TITLE_ABS:(protein OR NMR))'
"Jane Dyson" = 'AUTH:"Dyson HJ"'
"Judith Klinman" = 'AUTH:"Klinman JP"'
"Dan Herschlag" = 'AUTH:"Herschlag D"'
"Sharon Hammes-Schiffer" = 'AUTH:"Hammes-Schiffer S"'
"James Fraser" = 'AUTH:"Fraser JS" AND (AFF:"San Francisco" OR TITLE_ABS:(protein OR crystallography OR enzyme))'
"Gregory Bowman" = 'AUTH:"Bowman GR"'
"Kresten Lindorff-Larsen" = 'AUTH:"Lindorff-Larsen K"'
"Michele Vendruscolo" = 'AUTH:"Vendruscolo M"'
"Gerhard Hummer" = 'AUTH:"Hummer G"'
"Gevorg Grigoryan" = 'AUTH:"Grigoryan G"'
